name: Auto changelog (Claude)

# Copiar este archivo a .github/workflows/update-changelog.yml en cada uno
# de los 6 repos del portfolio. Requiere el secret ANTHROPIC_API_KEY
# configurado en cada repo (Settings > Secrets and variables > Actions).

on:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-changelog:
    if: "!contains(github.event.head_commit.message, '[skip changelog]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install anthropic --quiet

      - name: Generar resumen con Claude y actualizar CHANGELOG.md
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: python scripts/generate_changelog.py

      - name: Commit changelog actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet && echo "Sin cambios en CHANGELOG.md" || git commit -m "docs: actualizar changelog [skip changelog]"
          git push
